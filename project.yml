name: ShotKeep
options:
  bundleIdPrefix: com.nelahian
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  ShotKeep:
    type: application
    platform: macOS
    sources:
      - ShotKeep
    info:
      path: ShotKeep/Info.plist
      properties:
        LSUIElement: true
    entitlements:
      path: ShotKeep/ShotKeep.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.nelahian.shotkeep
        INFOPLIST_FILE: ShotKeep/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    frameworks:
      - sdk: QuickLookThumbnailing.framework
