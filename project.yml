name: ShotKeep
options:
  bundleIdPrefix: com.nelahian
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Hardened Runtime is intentionally NOT enabled here. It requires a real
    # Developer ID signature to be honored correctly — paired with the
    # ad-hoc signing used for local builds (CODE_SIGN_IDENTITY: "-" below),
    # it can make macOS silently refuse TCC/Full Disk Access grants to
    # protected folders (~/Desktop) even when the toggle looks enabled in
    # System Settings. The CI release build enables it explicitly, alongside
    # the real Developer ID signature (it's required for notarization).

targets:
  ShotKeep:
    type: application
    platform: macOS
    sources:
      - ShotKeep
    info:
      path: ShotKeep/Info.plist
      properties:
        LSUIElement: true
    entitlements:
      path: ShotKeep/ShotKeep.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.nelahian.shotkeep
        INFOPLIST_FILE: ShotKeep/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    frameworks:
      - sdk: QuickLookThumbnailing.framework
