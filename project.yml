name: ShotCubby
options:
  bundleIdPrefix: com.nelahian
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.2"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Hardened Runtime is intentionally NOT enabled here. It requires a real
    # Developer ID signature to be honored correctly — paired with the
    # ad-hoc signing used for local builds (CODE_SIGN_IDENTITY: "-" below),
    # it can make macOS silently refuse TCC/Full Disk Access grants to
    # protected folders (~/Desktop) even when the toggle looks enabled in
    # System Settings. The CI release build enables it explicitly, alongside
    # the real Developer ID signature (it's required for notarization).

targets:
  ShotCubby:
    type: application
    platform: macOS
    sources:
      - ShotCubby
    info:
      # xcodegen regenerates ShotCubby/Info.plist from this block on every
      # `xcodegen generate`, so anything missing here is silently dropped
      # from the built app. The usage descriptions have to live here:
      # without them macOS cannot show the TCC consent prompt for a
      # protected folder and denies access outright, which surfaces as a
      # permission card that never clears no matter what the user toggles
      # in System Settings.
      path: ShotCubby/Info.plist
      properties:
        LSUIElement: true
        NSDesktopFolderUsageDescription: >-
          ShotCubby moves new screenshots out of this folder into ~/ShotCubby.
        NSDocumentsFolderUsageDescription: >-
          Needed only if you pick a custom screenshot folder inside Documents.
        NSDownloadsFolderUsageDescription: >-
          Needed only if you pick a custom screenshot folder inside Downloads.
        # A Desktop redirected by OneDrive, Google Drive or iCloud lives in
        # ~/Library/CloudStorage, inside a File Provider domain. macOS guards
        # those with a service of their own: the three keys above do not
        # apply, and without this one the folder is denied with no prompt
        # ever shown — which is exactly how the permission card became
        # unclearable for anyone with a cloud-redirected Desktop.
        NSFileProviderDomainUsageDescription: >-
          ShotCubby moves new screenshots out of your cloud-synced screenshot
          folder into ~/ShotCubby. Nothing else in the folder is read.
    entitlements:
      path: ShotCubby/ShotCubby.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.nelahian.shotcubby
        INFOPLIST_FILE: ShotCubby/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    frameworks:
      - sdk: ImageIO.framework
      - sdk: Carbon.framework
