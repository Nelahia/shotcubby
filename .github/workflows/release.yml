name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15

    env:
      APP_NAME: ShotCubby

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set release version in Info.plist
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" ShotCubby/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" ShotCubby/Info.plist

      - name: Import Developer ID signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=()
          while IFS= read -r line; do
            EXISTING_KEYCHAINS+=("$line")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ShotCubby.xcodeproj \
            -scheme ShotCubby \
            -configuration Release \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ENABLE_HARDENED_RUNTIME=YES \
            archive

      - name: Export signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 "build/export/${{ env.APP_NAME }}.app"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "${{ env.APP_NAME }}.app" 140 160 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 400 160 \
            "${{ env.APP_NAME }}.dmg" \
            "build/export/${{ env.APP_NAME }}.app" || true

          test -f "${{ env.APP_NAME }}.dmg"

      - name: Sign DMG
        run: |
          codesign --sign "Developer ID Application" --timestamp "${{ env.APP_NAME }}.dmg"
          codesign --verify --verbose=2 "${{ env.APP_NAME }}.dmg"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

          SUBMISSION_OUTPUT=$(xcrun notarytool submit "${{ env.APP_NAME }}.dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json)

          echo "$SUBMISSION_OUTPUT"
          STATUS=$(echo "$SUBMISSION_OUTPUT" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          SUB_ID=$(echo "$SUBMISSION_OUTPUT" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed, fetching log..."
            xcrun notarytool log "$SUB_ID" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi

      - name: Staple notarization ticket
        run: xcrun stapler staple "${{ env.APP_NAME }}.dmg"

      - name: Verify Gatekeeper acceptance
        run: spctl -a -t open --context context:primary-signature -v "${{ env.APP_NAME }}.dmg"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$API_KEY_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: ${{ env.APP_NAME }}.dmg

  build-windows:
    runs-on: windows-latest

    # SignPath reads the uploaded artifact back through the Actions API.
    permissions:
      contents: read
      actions: read

    env:
      APP_NAME: ShotCubby
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cache compiled dependencies between releases; the optimized build
      # recompiles all of them from scratch otherwise (~7 min).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: windows
        run: npm ci

      # Same tag-derived version as the macOS Info.plist, so both apps report it.
      - name: Build Tauri app
        working-directory: windows
        shell: bash
        run: npm run build -- --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}"

      - name: Upload unsigned installers
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi

      # Free signing from the SignPath Foundation (open-source program).
      # Skipped until the SIGNPATH_API_TOKEN secret exists, so releases keep
      # working, unsigned, in the meantime.
      - name: Sign installers with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: shotcubby
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect installers to publish
        shell: bash
        run: |
          mkdir out
          if [ -d signed ]; then
            find signed \( -name '*.exe' -o -name '*.msi' \) -exec cp {} out/ \;
          else
            cp windows/src-tauri/target/release/bundle/nsis/*.exe out/
            cp windows/src-tauri/target/release/bundle/msi/*.msi out/
          fi

      # The in-app updater only installs files signed with the project's
      # update key. Done last: signing the installer (SignPath above) changes
      # its bytes, and this signature must cover the file that gets published.
      - name: Sign installer for the in-app updater
        working-directory: windows
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign ../out/*.exe

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: out/*

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    env:
      APP_NAME: ShotCubby

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/mac

      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist/windows

      # Tauri names installers after its own version (e.g. ShotCubby_0.1.0_x64-setup.exe);
      # stable names let the landing page link to releases/latest/download/<name>.
      - name: Give Windows installers stable names
        run: |
          mv dist/windows/*.exe "dist/windows/${{ env.APP_NAME }}-Setup.exe"
          mv dist/windows/*.msi "dist/windows/${{ env.APP_NAME }}.msi"
          mv dist/windows/*.exe.sig "dist/windows/${{ env.APP_NAME }}-Setup.exe.sig"

      # What the app's updater reads to learn that a newer release exists.
      - name: Write updater manifest
        run: |
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${{ env.APP_NAME }}-Setup.exe" \
            --arg sig "$(cat "dist/windows/${{ env.APP_NAME }}-Setup.exe.sig")" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > dist/latest.json

      - name: Get macOS SHA256
        id: sha
        run: echo "sha256=$(sha256sum "dist/mac/${{ env.APP_NAME }}.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mac/${{ env.APP_NAME }}.dmg
            dist/windows/*.exe
            dist/windows/*.msi
            dist/latest.json
          generate_release_notes: true
          body: |
            ## ShotCubby ${{ github.ref_name }}

            Menu bar app that automatically captures and organizes all your screenshots.

            ### macOS
            Signed with a Developer ID Application certificate and notarized by Apple —
            opens with no Gatekeeper warning.

            Download `${{ env.APP_NAME }}.dmg`, open it, drag `${{ env.APP_NAME }}.app` to Applications.
            Requires macOS 14.0 (Sonoma) or later.

            **SHA256:** `${{ steps.sha.outputs.sha256 }}`

            ### Windows
            If Windows SmartScreen warns on first run, click "More info" → "Run anyway".
            Signed builds use a free certificate from the SignPath Foundation; a new
            certificate can still trigger the warning until it builds reputation.

            Download `${{ env.APP_NAME }}-Setup.exe` (or `${{ env.APP_NAME }}.msi`). Requires Windows 10/11.
