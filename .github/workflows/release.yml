name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    env:
      APP_NAME: ShotKeep

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set release version in Info.plist
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" ShotKeep/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" ShotKeep/Info.plist

      - name: Import Developer ID signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=()
          while IFS= read -r line; do
            EXISTING_KEYCHAINS+=("$line")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ShotKeep.xcodeproj \
            -scheme ShotKeep \
            -configuration Release \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            archive

      - name: Export signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 "build/export/${{ env.APP_NAME }}.app"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "${{ env.APP_NAME }}.app" 140 160 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 400 160 \
            "${{ env.APP_NAME }}.dmg" \
            "build/export/${{ env.APP_NAME }}.app" || true

          test -f "${{ env.APP_NAME }}.dmg"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

          SUBMISSION_OUTPUT=$(xcrun notarytool submit "${{ env.APP_NAME }}.dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json)

          echo "$SUBMISSION_OUTPUT"
          STATUS=$(echo "$SUBMISSION_OUTPUT" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          SUB_ID=$(echo "$SUBMISSION_OUTPUT" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed, fetching log..."
            xcrun notarytool log "$SUB_ID" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi

      - name: Staple notarization ticket
        run: xcrun stapler staple "${{ env.APP_NAME }}.dmg"

      - name: Verify Gatekeeper acceptance
        run: spctl -a -t open --context context:primary-signature -v "${{ env.APP_NAME }}.dmg"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$API_KEY_PATH"

      - name: Get SHA256
        id: sha
        run: echo "sha256=$(shasum -a 256 ${{ env.APP_NAME }}.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}.dmg
          body: |
            ## ShotKeep ${{ github.ref_name }}

            Menu bar app that automatically captures and organizes all your macOS screenshots.

            This build is **signed with a Developer ID Application certificate and notarized by Apple** — it opens with no Gatekeeper warning.

            ### Install via Homebrew
            ```bash
            brew tap nelahia/tap
            brew install --cask shotkeep
            ```

            ### Manual install
            Download `ShotKeep.dmg`, open it, drag `ShotKeep.app` to Applications.

            ### Requirements
            - macOS 14.0 (Sonoma) or later

            **SHA256:** `${{ steps.sha.outputs.sha256 }}`
