name: Build & Release

# Releases are started by the /release skills, which create the tag from the
# maintainer's machine first. The workflow's own token cannot create a tag at a
# commit that contains workflow files (GitHub answers 403), so a push-tag
# trigger would only start a duplicate run alongside the manual one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish (e.g. v2.2.22)
        required: true
      platform:
        description: Which app to rebuild; the other one is carried over from the previous release
        type: choice
        options: [both, mac, windows]
        default: both

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  build-mac:
    if: inputs.platform != 'windows'
    runs-on: macos-15

    env:
      APP_NAME: ShotCubby

    # Every `run` step works from the macOS app's folder; `uses` steps
    # (upload-artifact) still resolve paths from the repository root.
    defaults:
      run:
        working-directory: apps/macos

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set release version in Info.plist
        run: |
          plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" ShotCubby/Info.plist
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" ShotCubby/Info.plist

      - name: Import Developer ID signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=()
          while IFS= read -r line; do
            EXISTING_KEYCHAINS+=("$line")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ShotCubby.xcodeproj \
            -scheme ShotCubby \
            -configuration Release \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ENABLE_HARDENED_RUNTIME=YES \
            archive

      - name: Export signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/${{ env.APP_NAME }}.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Verify code signature
        run: |
          codesign --verify --deep --strict --verbose=2 "build/export/${{ env.APP_NAME }}.app"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --window-size 540 380 \
            --icon-size 128 \
            --icon "${{ env.APP_NAME }}.app" 140 160 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 400 160 \
            "${{ env.APP_NAME }}.dmg" \
            "build/export/${{ env.APP_NAME }}.app" || true

          test -f "${{ env.APP_NAME }}.dmg"

      - name: Sign DMG
        run: |
          codesign --sign "Developer ID Application" --timestamp "${{ env.APP_NAME }}.dmg"
          codesign --verify --verbose=2 "${{ env.APP_NAME }}.dmg"

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

          SUBMISSION_OUTPUT=$(xcrun notarytool submit "${{ env.APP_NAME }}.dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json)

          echo "$SUBMISSION_OUTPUT"
          STATUS=$(echo "$SUBMISSION_OUTPUT" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          SUB_ID=$(echo "$SUBMISSION_OUTPUT" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed, fetching log..."
            xcrun notarytool log "$SUB_ID" \
              --key "$API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
            exit 1
          fi

      - name: Staple notarization ticket
        run: xcrun stapler staple "${{ env.APP_NAME }}.dmg"

      - name: Verify Gatekeeper acceptance
        run: spctl -a -t open --context context:primary-signature -v "${{ env.APP_NAME }}.dmg"

      # In-app updates (Sparkle) only install a disk image signed with the
      # project's update key. Done on the final, stapled image. Skipped until
      # the SPARKLE_PRIVATE_KEY secret exists, so releases keep working without.
      - name: Sign the update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "No SPARKLE_PRIVATE_KEY secret: not signing the update."
            exit 0
          fi
          curl -sfL -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz"
          mkdir sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools
          SIGN_UPDATE="$(find sparkle-tools -name sign_update -type f | head -1)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          "$SIGN_UPDATE" --ed-key-file "$RUNNER_TEMP/sparkle.key" "${{ env.APP_NAME }}.dmg" | tee sparkle-signature.txt
          rm -f "$RUNNER_TEMP/sparkle.key"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$API_KEY_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            apps/macos/${{ env.APP_NAME }}.dmg
            apps/macos/sparkle-signature.txt

  build-windows:
    if: inputs.platform != 'mac'
    runs-on: windows-latest

    # SignPath reads the uploaded artifact back through the Actions API.
    permissions:
      contents: read
      actions: read

    env:
      APP_NAME: ShotCubby
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      # Cache compiled dependencies between releases; the optimized build
      # recompiles all of them from scratch otherwise (~7 min).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: apps/windows
        run: npm ci

      # Same tag-derived version as the macOS Info.plist, so both apps report it.
      - name: Build Tauri app
        working-directory: apps/windows
        shell: bash
        run: npm run build -- --config "{\"version\":\"${TAG#v}\"}"

      - name: Upload unsigned installers
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/target/release/bundle/msi/*.msi

      # Free signing from the SignPath Foundation (open-source program).
      # Skipped until the SIGNPATH_API_TOKEN secret exists, so releases keep
      # working, unsigned, in the meantime.
      - name: Sign installers with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: shotcubby
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect installers to publish
        shell: bash
        run: |
          mkdir out
          if [ -d signed ]; then
            find signed \( -name '*.exe' -o -name '*.msi' \) -exec cp {} out/ \;
          else
            cp apps/windows/src-tauri/target/release/bundle/nsis/*.exe out/
            cp apps/windows/src-tauri/target/release/bundle/msi/*.msi out/
          fi

      # The in-app updater only installs files signed with the project's
      # update key. Done last: signing the installer (SignPath above) changes
      # its bytes, and this signature must cover the file that gets published.
      - name: Sign installer for the in-app updater
        working-directory: apps/windows
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign ../../out/*.exe

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: out/*

  # Each platform publishes on its own as soon as its build is done, in
  # parallel with the other: a failure or a slow build on one side never holds
  # back or cancels the other. The two publish jobs share a concurrency group
  # only so they never create the release at the same moment — the second one
  # waits its turn, it is never cancelled.
  release-mac:
    needs: build-mac
    concurrency: release-${{ inputs.tag }}
    runs-on: ubuntu-latest

    env:
      APP_NAME: ShotCubby
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/mac

      - name: Write the disk image checksum
        working-directory: dist/mac
        run: sha256sum "${{ env.APP_NAME }}.dmg" > "${{ env.APP_NAME }}.dmg.sha256"

      # The feed Sparkle reads (SUFeedURL points at releases/latest/download/appcast.xml).
      # sparkle:version is the build number the app was stamped with in build-mac.
      - name: Write the Sparkle update feed
        run: |
          if [ ! -f dist/mac/sparkle-signature.txt ]; then
            echo "No update signature: not writing a feed."
            exit 0
          fi
          cat > dist/mac/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>${{ env.APP_NAME }}</title>
              <item>
                <title>Version ${TAG#v}</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>${{ github.run_number }}</sparkle:version>
                <sparkle:shortVersionString>${TAG#v}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ env.APP_NAME }}.dmg" $(cat dist/mac/sparkle-signature.txt) type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF

      - name: Create the release if the Windows job has not yet
        run: bash .github/scripts/ensure-release.sh "$TAG" "${{ inputs.platform || 'both' }}" "${{ github.sha }}"

      - name: Upload the macOS files
        run: |
          files=("dist/mac/${{ env.APP_NAME }}.dmg" "dist/mac/${{ env.APP_NAME }}.dmg.sha256")
          [ -f dist/mac/appcast.xml ] && files+=(dist/mac/appcast.xml)
          gh release upload "$TAG" "${files[@]}" --clobber

  release-windows:
    needs: build-windows
    concurrency: release-${{ inputs.tag }}
    runs-on: ubuntu-latest

    env:
      APP_NAME: ShotCubby
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist/windows

      # Tauri names installers after its own version (e.g. ShotCubby_0.1.0_x64-setup.exe);
      # stable names let the landing page link to releases/latest/download/<name>.
      - name: Give Windows installers stable names
        run: |
          mv dist/windows/*.exe "dist/windows/${{ env.APP_NAME }}-Setup.exe"
          mv dist/windows/*.msi "dist/windows/${{ env.APP_NAME }}.msi"
          mv dist/windows/*.exe.sig "dist/windows/${{ env.APP_NAME }}-Setup.exe.sig"

      # What the app's updater reads to learn that a newer release exists.
      - name: Write updater manifest
        run: |
          jq -n \
            --arg version "${TAG#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ env.APP_NAME }}-Setup.exe" \
            --arg sig "$(cat "dist/windows/${{ env.APP_NAME }}-Setup.exe.sig")" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > dist/latest.json

      - name: Create the release if the macOS job has not yet
        run: bash .github/scripts/ensure-release.sh "$TAG" "${{ inputs.platform || 'both' }}" "${{ github.sha }}"

      - name: Upload the Windows files
        run: |
          gh release upload "$TAG" --clobber \
            "dist/windows/${{ env.APP_NAME }}-Setup.exe" \
            "dist/windows/${{ env.APP_NAME }}.msi" \
            dist/latest.json
