<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShotCubby</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        padding: 14px;
      }
      /* [hidden] must win over the flex rules below it, which otherwise
         outrank the UA stylesheet's [hidden]{display:none} by specificity. */
      #access-card[hidden],
      #empty-state[hidden],
      #filter-bar[hidden] {
        display: none;
      }
      #header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px 0 4px;
        height: 42px;
      }
      #header .glyph {
        width: 18px;
        height: 18px;
      }
      #header .title {
        font-weight: 600;
        font-size: 14px;
      }
      #header .count {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: var(--muted);
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--line);
      }
      #header .spacer {
        flex: 1;
      }
      .icon-btn {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
      }
      .icon-btn:hover {
        background: var(--line);
        color: var(--ink);
      }
      #filter-bar {
        display: flex;
        gap: 2px;
        padding: 2px;
        margin: 0 4px 8px;
        background: var(--line);
        border-radius: 8px;
      }
      #filter-bar button {
        flex: 1;
        height: 26px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      #filter-bar button.on {
        background: var(--panel);
        color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      #filter-bar button .n {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        opacity: 0.7;
      }
      #content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 4px;
      }
      .day-label {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 10px 6px 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 0 2px 10px;
      }
      .tile {
        position: relative;
        aspect-ratio: 4 / 3;
        border-radius: 8px;
        background: var(--tile);
        box-shadow: inset 0 0 0 1px var(--line);
        overflow: hidden;
        cursor: pointer;
      }
      .tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .shot-name {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        padding: 3px 5px;
        margin-top: 4px;
        border-radius: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: text;
      }
      .shot-name:hover {
        background: var(--line);
      }
      .shot-name input {
        width: 100%;
        font: inherit;
        background: var(--panel);
        color: var(--ink);
        border-radius: 5px;
        box-shadow: 0 0 0 2px var(--accent);
        padding: 3px 5px;
        outline: none;
        border: 0;
      }
      .shot-meta {
        display: flex;
        justify-content: space-between;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 10px;
        color: var(--muted);
        padding: 0 5px;
      }
      #empty-state {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--muted);
        text-align: center;
      }
      #empty-state .glyph {
        width: 28px;
        height: 28px;
        opacity: 0.7;
      }
      #footer {
        display: flex;
        align-items: center;
        padding: 10px 6px 0;
        margin-top: 8px;
        border-top: 1px solid var(--line);
      }
      .footer-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 13px;
      }
      .footer-btn:hover {
        background: var(--line);
      }
      #access-card {
        margin: 0 4px 10px;
        padding: 16px;
        border-radius: 12px;
        background: var(--panel);
        box-shadow: inset 0 0 0 1px var(--line);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #access-card .tag {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--warn);
      }
      #access-card .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--warn);
      }
      #access-card h3 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      #access-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.4;
      }
      #access-card .path-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        padding: 9px 10px;
        border-radius: 8px;
        background: var(--bg);
        box-shadow: inset 0 0 0 1px var(--line);
        overflow: hidden;
        white-space: nowrap;
      }
      #access-card .primary-btn {
        height: 34px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--bg);
        font-weight: 600;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #access-card .link-btn {
        color: var(--accent);
        font-size: 12px;
        text-align: center;
        padding: 4px 0;
      }
      #access-card .muted-btn {
        color: var(--muted);
        text-align: center;
        padding: 6px 0;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div id="header">
        <span class="glyph"></span>
        <span class="title">ShotCubby</span>
        <span class="count" id="count">0</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="settings-btn" data-i18n-title="Settings"></button>
      </div>

      <div id="access-card" hidden></div>
      <div id="filter-bar"></div>
      <div id="content">
        <div id="empty-state" hidden></div>
        <div id="groups"></div>
      </div>

      <div id="footer">
        <button class="footer-btn" id="spotlight-btn">
          <span style="display: flex"></span>
          <span data-i18n>Open Spotlight</span>
          <span class="kbd" id="spotlight-kbd"></span>
        </button>
        <span class="spacer"></span>
        <button class="footer-btn" id="quit-btn">
          <span style="color: var(--muted)" data-i18n>Quit</span>
        </button>
      </div>
    </div>
    <script type="module" src="popover.js"></script>
  </body>
</html>
