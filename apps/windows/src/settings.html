<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShotCubby Settings</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        display: flex;
        background: var(--bg);
      }
      #sidebar {
        width: 180px;
        flex: none;
        padding: 16px 10px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: var(--panel);
        box-shadow: inset -1px 0 0 var(--line);
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        text-align: left;
      }
      .nav-item:hover {
        background: var(--line);
      }
      .nav-item.selected {
        font-weight: 600;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      #content {
        flex: 1;
        min-width: 0;
        padding: 20px 24px;
        overflow-y: auto;
      }
      #page-title {
        margin: 0 0 14px;
        font-size: 17px;
        font-weight: 600;
      }
      #rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .row .label {
        flex: 1;
        font-size: 13px;
      }
      .row .status {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .reset-btn:disabled {
        opacity: 0.5;
      }
      .hotkey-field {
        min-width: 170px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--line);
        box-shadow: inset 0 0 0 2px transparent;
        text-align: center;
      }
      .hotkey-field.recording {
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .reset-btn {
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 6px;
      }
      .reset-btn:hover {
        background: var(--line);
      }
      .vault {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 6px 0;
      }
      .vault-title {
        font-weight: 600;
      }
      .vault-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 0 0 1px var(--line);
      }
      .vault-icon {
        color: var(--accent);
      }
      .vault-path {
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .dialog-go {
        font-size: 13px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 6px;
        background: var(--accent);
        color: #04252a;
      }
      .dialog-scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .dialog {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 20px;
        border-radius: 14px;
        background: var(--panel);
        box-shadow: 0 0 0 1px var(--line), inset 0 0 0 1.5px var(--accent);
      }
      .dialog-title {
        font-size: 15px;
        font-weight: 600;
      }
      .dialog-paths {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 6px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--bg);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .dialog-paths .strong {
        font-weight: 600;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .dialog-bar {
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--line) 25%, var(--accent) 50%, var(--line) 75%) 0 0 / 200% 100%;
        animation: dialog-slide 1.1s linear infinite;
      }
      @keyframes dialog-slide {
        to {
          background-position: -200% 0;
        }
      }
      #footer-text {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      #error {
        margin-top: 8px;
        font-size: 12px;
        color: var(--warn);
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <nav id="sidebar"></nav>
    <main id="content">
      <h1 id="page-title"></h1>
      <div id="rows"></div>
      <div id="error"></div>
      <div id="footer-text"></div>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
