[package]
name = "shotcubby"
version = "0.1.0"
description = "ShotCubby catches every screenshot and files it in one folder"
authors = ["Nelahia"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shotcubby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
arboard = "3.6.1"
trash = "5.2.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
rfd = "0.17.2"
dirs = "7.0.0"
chrono = "0.4.45"
base64 = "0.23.1"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_System_DataExchange", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
