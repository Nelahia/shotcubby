<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShotCubby Settings</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        padding: 20px;
        background: var(--bg);
      }
      #rows {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .row .label {
        flex: 1;
        font-size: 13px;
      }
      .hotkey-field {
        min-width: 170px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--line);
        box-shadow: inset 0 0 0 2px transparent;
        text-align: center;
      }
      .hotkey-field.recording {
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .reset-btn {
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 6px;
      }
      .reset-btn:hover {
        background: var(--line);
      }
      #version {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }
      #footer-text {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      #error {
        margin-top: 8px;
        font-size: 12px;
        color: var(--warn);
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div id="rows"></div>
    <div id="error"></div>
    <div id="version"></div>
    <div id="footer-text">
      Click a field, then press the combination you want: a modifier (Ctrl, Alt, Shift, Win) plus a key, or a lone function / PrintScreen key. Esc cancels.
    </div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
