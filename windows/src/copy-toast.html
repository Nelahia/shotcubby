<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShotCubby Copy</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        display: flex;
        align-items: center;
      }
      #pill {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        height: 100%;
        padding: 0 14px;
        border-radius: 999px;
        background: #14191d; /* the logo's dark navy, in both themes */
        color: #fff;
        font-size: 12px;
        font-weight: 500;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      #pill .icon {
        width: 13px;
        height: 13px;
        stroke-width: 2.5;
        flex: none;
      }
      #pill.flash {
        animation: pill-in 0.9s ease forwards;
      }
      @keyframes pill-in {
        0% {
          opacity: 0;
          transform: translateY(-10px);
        }
        15% {
          opacity: 1;
          transform: translateY(0);
        }
        75% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-6px);
        }
      }
    </style>
  </head>
  <body>
    <div id="pill"></div>
    <script type="module" src="copy-toast.js"></script>
  </body>
</html>
