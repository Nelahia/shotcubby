<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1260px; height: 1200px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 40px; background: #98A9C4; font-family: 'Segoe UI', system-ui, sans-serif">
<div style="display: flex; gap: 40px; align-items: flex-start">
<dc-import name="Popover" mode="light" hint-size="380px,480px"></dc-import>
<dc-import name="Spotlight" mode="light" hint-size="760px,460px"></dc-import>
</div>
<dc-import name="SettingsMac" mode="light" hint-size="800px,600px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1260,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
