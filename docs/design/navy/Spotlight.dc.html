<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 760px; height: 460px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; background: {{t.bg}}; color: {{t.ink}}; border: 1px solid {{t.line}}; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px">

<div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid {{t.line}}">
<span style="color: {{t.accent}}; display: flex">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M12 12h.01"/></svg>
</span>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search screenshots</label>
<input id="q" placeholder="Search screenshots" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: {{t.ink}}; font: inherit; font-size: 19px; caret-color: {{t.accent}}">
<span style="font-size: 12px; padding: 3px 10px; border-radius: 99px; background: {{t.raised}}; color: {{t.muted}}">60</span>
</div>

<div style="flex: 1; min-height: 0; display: flex">

<div style="width: 300px; flex-shrink: 0; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 10px; background: {{row.bg}}; box-shadow: inset 0 0 0 1px {{row.ring}}">
<div style="width: 46px; height: 32px; flex-shrink: 0; position: relative; overflow: hidden; border-radius: 6px; background: {{row.thumb}}">
<div style="position: absolute; left: 12%; top: 18%; width: 50%; height: 14%; border-radius: 2px; background: {{row.bar}}"></div>
<div style="position: absolute; left: 12%; top: 46%; width: 70%; height: 30%; border-radius: 3px; background: {{row.bar2}}"></div>
</div>
<div style="min-width: 0">
<div style="font-size: 13px; font-weight: 600; color: {{row.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.name}}</div>
<div style="font-size: 11px; color: {{row.muted}}; margin-top: 1px">{{row.time}}</div>
</div>
</div>
</sc-for>
</div>

<div style="flex: 1; min-width: 0; box-sizing: border-box; padding: 14px 18px 14px 10px; display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; height: 230px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, {{t.surface}}, {{t.raised}}); border: 1px solid {{t.line}}">
<div style="position: absolute; left: 7%; top: 10%; width: 38%; height: 7%; border-radius: 4px; background: {{t.strong}}"></div>
<div style="position: absolute; left: 7%; top: 24%; width: 62%; height: 5%; border-radius: 3px; background: {{t.line}}"></div>
<div style="position: absolute; left: 7%; top: 34%; width: 52%; height: 5%; border-radius: 3px; background: {{t.line}}"></div>
<div style="position: absolute; left: 7%; top: 50%; width: 40%; height: 36%; border-radius: 8px; background: {{t.line}}"></div>
<div style="position: absolute; left: 52%; top: 50%; width: 41%; height: 36%; border-radius: 8px; background: {{t.line}}"></div>
</div>
<div>
<div style="font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12.5px; color: {{t.ink}}">Screenshot 2026-10-24 194813.png</div>
<div style="font-size: 12px; color: {{t.muted}}; margin-top: 4px">24/10/2026 19:48:13 · file</div>
</div>
</div>

</div>

<div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-top: 1px solid {{t.line}}; font-size: 12px; color: {{t.muted}}">
<div style="display: flex; align-items: center; gap: 16px">
<span style="display: flex; align-items: center; gap: 8px"><span style="padding: 2px 7px; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line}}">&#8629;</span>Preview</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line}}">Ctrl C</span>Copy</span>
</div>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 600; color: {{t.ink}}">Actions</span><span style="font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 11px; padding: 2px 7px; border-radius: 6px; background: {{t.surface}}; border: 1px solid {{t.line}}">Ctrl K</span></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":760,"height":460}}'>
class Component extends DCLogic {
renderVals() {
const light = this.props.mode === 'light';
const t = light
? { bg: '#DCE3EF', surface: '#F3F6FB', raised: '#C7D1E3', strong: '#98A9C4', muted: '#536684', ink: '#111522', accent: '#303D59', line: 'rgba(17,21,34,0.14)' }
: { bg: '#111522', surface: '#1E263B', raised: '#303D59', strong: '#536684', muted: '#98A9C4', ink: '#DCE3EF', accent: '#98A9C4', line: 'rgba(152,169,196,0.18)' };
const names = [
['Pricing table', '2 min ago'],
['Settings, AI naming', '3 min ago'],
['Screenshot 2026-10-24 194813', '4 min ago'],
['Screenshot 2026-10-23 103941', 'yesterday'],
['Invoice March', 'yesterday'],
['Release notes draft', '8 days ago']
];
const rows = names.map((n, i) => {
const on = i === 2;
return {
name: n[0], time: n[1],
bg: on ? t.raised : 'transparent',
ring: on ? t.strong : 'transparent',
thumb: 'linear-gradient(135deg, ' + t.surface + ', ' + t.raised + ')',
bar: t.strong, bar2: t.line,
ink: t.ink, muted: t.muted
};
});
return { t, rows };
}
}
</script>
</body>
</html>
